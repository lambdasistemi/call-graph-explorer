<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call Graph Explorer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    body > div {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    #toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: #16213e;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    #toolbar input {
      padding: 4px 8px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #252542;
      color: #e0e0e0;
      font-size: 12px;
      font-family: monospace;
    }
    #repo-input { width: 220px; }
    #ref-input { width: 150px; }
    #token-input { width: 150px; }
    #toolbar input:focus {
      outline: none;
      border-color: #4a90d9;
    }
    #toolbar button {
      padding: 4px 10px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #252542;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 12px;
    }
    #toolbar button:hover {
      background: #333;
      border-color: #666;
    }
    #toolbar button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    #depth-ctrl {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #aaa;
    }
    #error-bar {
      padding: 6px 12px;
      background: #5a1a1a;
      color: #ff8888;
      font-size: 12px;
      border-bottom: 1px solid #733;
    }
    #main {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    #cy {
      flex: 1;
      min-width: 0;
      background: #0f1525;
      position: relative;
    }
    #cy #placeholder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #555;
      font-size: 14px;
      text-align: center;
    }
    #sidebar {
      width: 380px;
      background: #16213e;
      border-left: 1px solid #333;
      overflow-y: auto;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    #sidebar > div, #sidebar > p {
      padding: 10px 12px;
    }
    #sidebar h3 {
      color: #4a90d9;
      margin-bottom: 4px;
      font-size: 14px;
      word-break: break-all;
    }
    #sidebar p {
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }
    .kind-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
      margin-right: 6px;
    }
    .kind-module { background: #2c3e50; }
    .kind-type { background: #8e44ad; }
    .kind-function { background: #27ae60; }
    .kind-constructor { background: #e67e22; }
    .kind-field { background: #3498db; }
    .module-path {
      font-family: monospace;
      font-size: 11px;
      color: #888;
      margin: 4px 0;
    }
    #source-code {
      flex: 1;
      margin: 0;
      padding: 0;
      border-top: 1px solid #333;
      overflow: auto;
      tab-size: 4;
    }
    #source-code code {
      display: block;
      font-size: 12px;
      line-height: 1.6;
      padding: 10px 12px !important;
    }
  </style>
</head>
<body>
  <link rel="stylesheet" href="https://unpkg.com/@highlightjs/cdn-assets@11.11.1/styles/github-dark.min.css">
  <script src="https://unpkg.com/@highlightjs/cdn-assets@11.11.1/highlight.min.js"></script>
  <script src="https://unpkg.com/@highlightjs/cdn-assets@11.11.1/languages/haskell.min.js"></script>
  <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/elkjs@0.9.3/lib/elk.bundled.js"></script>
  <script src="https://unpkg.com/cytoscape-elk@2.2.0/dist/cytoscape-elk.js"></script>
  <script>
    if (typeof cytoscapeElk !== 'undefined') {
      cytoscape.use(cytoscapeElk);
    }
  </script>
  <script src="index.js"></script>
</body>
</html>
